<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Nelvax</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image" href="icon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to your account</p>

            <form id="signin-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signin-email" placeholder="email@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signin-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="btn-sign-in">Sign In</button>
            </form>

            <div class="divider"><span>or</span></div>

            <button class="btn-google" id="google-signin">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Sign in with Google
            </button>

            <p class="footer-text">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
            <p class="footer-text">
                <a href="forget.html"> Forgot Password?</a>
            </p>
        </div>
    </div>
 
<script>
document.addEventListener("DOMContentLoaded", () => {
    
    // 1. DOM ELEMENT REFERENCE EXTRACTION MATRIX
    const loginForm    = document.getElementById("signin-form");
    const emailInput   = document.getElementById("signin-email");
    const passwordInput = document.getElementById("signin-password");
    const submitButton  = document.getElementById("btn-sign-in");

    // 🛡️ DEFENSIVE GUARD RAIL
    // Safely halts execution if this script runs on a page missing your target form
    if (!loginForm) {
        console.warn("Client Engine: 'signin-form' element absent from the active DOM tree. Bypassing listener initialization.");
        return;
    }

    console.log("Client Engine: Sign-In operational modules successfully mapped to DOM IDs.");

    // 2. SUBMISSION EVENT INTERCEPTION INTERACTION
    loginForm.addEventListener("submit", (event) => {
        
        // Prevent the standard browser engine from refreshing the document layout
        event.preventDefault();

        // Collect sanitized user string arrays from input text streams
        const email    = emailInput.value.trim();
        const password = passwordInput.value;

        // 🚀 CRITICAL OPTIMIZATION: Network Submission Throttling
        // Locks down the button immediately to block duplicate click attempts while loading
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = "Authenticating Session...";
        }

        /**
         * 🚀 CONTEXT-AWARE ROUTING TELEMETRY FLAG
         * This flashes a temporary token into the tab memory matrix. 
         * Your global observer inside master 'app.js' detects this value 
         * and knows this is an existing user attempting a fresh sign-in entry,
         * bypassing the sign-out penalty and steering them directly into home.html.
         */
        sessionStorage.setItem('isLoggingIn', 'true');

        // 3. FIRESTORE AUTHENTICATION PIPELINE TRANSMISSION
        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                console.log(`Session Authorization: Identity verified successfully for [${userCredential.user.uid}]`);
                
                // Note: No window.location.href manual routing is required here.
                // The master auth sentinel inside app.js catches this state shift instantly.
            })
            .catch((error) => {
                /**
                 * EXCEPTION RECOVERY PIPELINE
                 * If credentials fail or a network drop breaks the request handshake, 
                 * we purge the flag immediately so the application state remains secure.
                 */
                sessionStorage.removeItem('isLoggingIn');
                
                // Re-enable interface controls so your client can try again
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = "Sign In";
                }

                // Log the operational breakdown parameters to the debug terminal
                console.error("Authentication Exception Intercepted:", error.code, error.message);
                
                // Present a clean visual alert detailing the authentication barrier context
                alert(`Login Failed: ${error.message}`);
            });
    });
});
</script>
    <script type="module" src="auth.js"></script>
    
</body>
</html>
